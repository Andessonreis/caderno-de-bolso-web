name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; não cancela a que já está em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /caderno-de-bolso-web
      NEXT_PUBLIC_MOBILE_REPO_URL: https://github.com/Andessonreis/caderno-de-bolso-mobile
      # Servidor do grupo. A chave é a pública (publishable), feita para ficar no navegador.
      NEXT_PUBLIC_SUPABASE_URL: https://usnrgytoupqwikgcwwjb.supabase.co
      NEXT_PUBLIC_SUPABASE_KEY: sb_publishable_2Qv8OPUk-Aj9zHOIxEXwzA_yBvYG5g4
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
          # Leva o .nojekyll, que impede o Jekyll de esconder a pasta _next.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
